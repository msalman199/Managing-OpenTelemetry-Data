receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  probabilistic_sampler:
    sampling_percentage: 50.0

  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  file/retained:
    path: ./data/traces_retained.json
    rotation:
      max_megabytes: 1
      max_backups: 3
      max_days: 7

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, probabilistic_sampler, batch]
      exporters: [file/retained, debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888
